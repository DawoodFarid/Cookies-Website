    /* ─── HERO ─── */
    .hero {
        min-height: 100vh;
        background: var(--dark);
        position: relative;
        display: flex;
        align-items: center;
        overflow: hidden;
    }

    .hero-bg-pattern {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 80% at 70% 50%, #3D2003 0%, #1C1009 100%);

    /* Decorative circles */
    .hero-circle {
        position: absolute;
        border-radius: 50%;
        opacity: .12;
        background: var(--caramel);
        animation: floatCircle 8s ease-in-out infinite;
    }
        .hero-circle:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -80px;
            right: -100px;
            animation-delay: 0s;
        }

        .hero-circle:nth-child(2) {
            width: 280px;
            height: 280px;
            bottom: 60px;
            right: 180px;
            animation-delay: 2s;
            opacity: .08;
        }

        .hero-circle:nth-child(3) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 5%;
            animation-delay: 4s;
            opacity: .1;
        }

    @keyframes floatCircle {
        0%, 100% {
            transform: translateY(0) scale(1);
        }

        50% {
            transform: translateY(-24px) scale(1.04);
        }

    .hero-content {

        font-weight: 600;

        margin-bottom: 1.4rem;
        animation: fadeUp .7s ease both;
    }
    .hero h1 {
        font-family: 'Playfair Display', serif;

        font-weight: 900;
        color: var(--cream);
        line-height: 1.05;
        letter-spacing: -0.03em;

    .hero-btns {

    .btn-ghost-custom {

        }

    .hero-image-wrap {
        position: relative;
        z-index: 2;
        animation: fadeLeft 1s .2s ease both;
    }

    .hero-plate {
        width: 100%;
        max-width: 520px;
        border-radius: 50%;
        aspect-ratio: 1;
        background: radial-gradient(circle at 35% 35%, #5c3010, #2a1200);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12rem;
        box-shadow: 0 40px 100px rgba(0,0,0,.6), inset 0 0 80px rgba(200,131,58,.1);
        margin: auto;
        position: relative;
    }
        .hero-plate::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--caramel) 0%, transparent 30%, var(--accent) 60%, transparent 80%, var(--caramel) 100%);
            z-index: -1;
            opacity: .35;
            animation: spinSlow 12s linear infinite;
        }

    @keyframes spinSlow {
        to {
            transform: rotate(360deg);
        }
    }

    .hero-stat {
        position: absolute;
        background: rgba(253,246,236,.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(253,246,236,.12);
        border-radius: 16px;
        padding: .8rem 1.2rem;
        color: var(--cream);
        font-size: .85rem;
    }
        .hero-stat strong {
            display: block;
            font-size: 1.4rem;
            font-family: 'Playfair Display', serif;
            color: var(--accent);
        }

        .hero-stat:nth-of-type(1) {
            top: 8%;
            right: -10px;
            animation: floatStat 6s ease-in-out infinite;
        }

        .hero-stat:nth-of-type(2) {
            bottom: 12%;
            left: -20px;
            animation: floatStat 6s 2s ease-in-out infinite;
        }

    @keyframes floatStat {
        0%,100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-10px);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    @keyframes fadeLeft {
        from {
            opacity: 0;
            transform: translateX(40px);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    /* ─── MARQUEE STRIP ─── */
    .marquee-strip {
        background: var(--caramel);
        padding: .85rem 0;
        overflow: hidden;
        white-space: nowrap;
    }

    .marquee-inner {
        display: inline-flex;
        animation: marquee 22s linear infinite;
    }

    .marquee-item {
        color: var(--white);
        font-size: .82rem;
        font-weight: 600;
        letter-spacing: .14em;
        text-transform: uppercase;
        padding: 0 2.5rem;
    }

    .marquee-dot {
        color: rgba(255,255,255,.5);
        margin: 0 .5rem;
    }

    @keyframes marquee {
        from {
            transform: translateX(0);

        to {

    .btn-add {

            background: rgba(200,131,58,.1);

    .process-num {
        width: 56px;

    .process-icon {

    .process-step h5 {
        font-family: 'Playfair Display', serif;
        color: var(--cream);
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: .6rem;
    }

    .process-step p {
        color: rgba(253,246,236,.55);
        font-size: .88rem;
        line-height: 1.7;

    <script >
    // ── Scroll Reveal ──
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
            entries.forEach((e, i) => {
                if (e.isIntersecting) {
                    e.target.style.transitionDelay = (i * 0.08) + 's';
                    e.target.classList.add('visible');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });
    reveals.forEach(el => io.observe(el));

    // ── Add to cart click feedback ──
    document.querySelectorAll('.btn-add').forEach(btn => {
            btn.addEventListener('click', function () {
                const orig = this.innerHTML;
                this.innerHTML = '<i class="bi bi-check2"></i> Added!';
                this.style.background = '#2a7a2a';
                setTimeout(() => {
                    this.innerHTML = orig;
                    this.style.background = '';
                }, 1500);
            });
        });

    // ── Subscribe button feedback ──
    document.querySelector('.newsletter-section .btn-primary-custom').addEventListener('click', function () {
            const input = document.querySelector('.newsletter-input');
            if (input.value.includes('@')) {
                this.innerHTML = '✓ You\'re In!';
                this.style.background = '#2a7a2a';
                input.value = '';
            } else {
                input.style.borderColor = '#c84040';
                setTimeout(() => input.style.borderColor = '', 1500);
            }
        });
    </script >

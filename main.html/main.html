    <script >
    // ── Scroll Reveal ──
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
            entries.forEach((e, i) => {
                if (e.isIntersecting) {
                    e.target.style.transitionDelay = (i * 0.08) + 's';
                    e.target.classList.add('visible');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });
    reveals.forEach(el => io.observe(el));

    // ── Add to cart click feedback ──
    document.querySelectorAll('.btn-add').forEach(btn => {
            btn.addEventListener('click', function () {
                const orig = this.innerHTML;
                this.innerHTML = '<i class="bi bi-check2"></i> Added!';
                this.style.background = '#2a7a2a';
                setTimeout(() => {
                    this.innerHTML = orig;
                    this.style.background = '';
                }, 1500);
            });
        });

    // ── Subscribe button feedback ──
    document.querySelector('.newsletter-section .btn-primary-custom').addEventListener('click', function () {
            const input = document.querySelector('.newsletter-input');
            if (input.value.includes('@')) {
                this.innerHTML = '✓ You\'re In!';
                this.style.background = '#2a7a2a';
                input.value = '';
            } else {
                input.style.borderColor = '#c84040';
                setTimeout(() => input.style.borderColor = '', 1500);
            }
        });
    </script >
